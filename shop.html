```html
<!--
  SHOP CATEGORY FIX

  Add this code immediately before your existing
  renderProducts(); / initial shop rendering code.

  It makes links such as:
  shop.html?category=atomic
  shop.html?category=bonding
  shop.html?category=organic
  shop.html?category=calculations
  automatically select the correct category.
-->

<script>
(function(){

  const params = new URLSearchParams(
    window.location.search
  );

  const category =
    params.get("category");

  if(!category) return;

  /*
    Your existing category buttons should use:
    data-category="atomic"
    data-category="bonding"
    data-category="organic"
    data-category="calculations"
    data-category="other"
  */

  const categoryButton =
    document.querySelector(
      `[data-category="${category}"]`
    );

  if(categoryButton){

    /*
      Remove the active state from
      the currently selected category.
    */

    document
      .querySelectorAll("[data-category]")
      .forEach(button => {

        button.classList.remove("active");

      });


    /*
      Activate the category from the URL.
    */

    categoryButton.classList.add("active");


    /*
      Trigger the same click behavior
      already used by the Shop filters.
    */

    categoryButton.click();

  }

})();
</script>
